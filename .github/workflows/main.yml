name: Build Android APK

on:
  push:
    branches: [ main, master ]
    # Documentation-only pushes do not need a 13 minute build.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      unpack_zip:
        description: "Unpack the ZIP in the repository root into the source tree before building"
        type: boolean
        default: true

# contents: write lets the workflow commit the unpacked sources and create the GitHub Release.
permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Shown to users as versionName "<base>.<run number>". Change it to release a new visible version.
  APP_VERSION_BASE: "1.2"
  KEY_ALIAS: magicrdr

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Unpacks MagicRDR-project.zip (the one in the repository root) so that src/, tests/, docs/ and
      # MagicRDR.sln are visible in the file tree. It only does so when a new ZIP was pushed (or when the
      # source tree does not exist yet, or when you start the workflow by hand), so a push that edits a
      # single source file never gets overwritten by an old ZIP.
      # README.md, LICENSE and .gitignore are yours: they are taken from the ZIP only if missing.
      - name: Unpack source ZIP into the repository
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          UNPACK_INPUT: ${{ inputs.unpack_zip }}
        run: |
          $zipChanged = $false
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $zipChanged = ($env:UNPACK_INPUT -ne "false")
          }
          else {
            $before = $env:BEFORE_SHA
            $known = $false
            if ($before -and $before -notmatch '^0+$') {
              git cat-file -e "${before}^{commit}" 2>$null
              $known = ($LASTEXITCODE -eq 0)
            }
            if (-not $known) {
              $zipChanged = $true
            }
            else {
              $changed = @(git diff --name-only $before $env:GITHUB_SHA)
              $zipChanged = (@($changed | Where-Object { $_ -match '^[^/]+\.zip$' }).Count -gt 0)
            }
          }
          if (-not (Test-Path "src")) {
            Write-Host "There is no src folder yet: unpacking the ZIP."
            $zipChanged = $true
          }

          if (-not $zipChanged) {
            Write-Host "No new ZIP in this push: building the files that are already in the repository."
            "EXTRACTED=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $zips = @(Get-ChildItem -Path . -Filter *.zip -File)
          if ($zips.Count -eq 0) {
            if (Test-Path "src") {
              Write-Host "No ZIP in the repository root: using the existing source tree."
              "EXTRACTED=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              exit 0
            }
            throw "No ZIP found in the repository root and no src folder. Upload MagicRDR-project.zip."
          }
          $zip = $zips | Where-Object { $_.Name -ieq "MagicRDR-project.zip" } | Select-Object -First 1
          if (-not $zip) { $zip = $zips | Sort-Object Length -Descending | Select-Object -First 1 }
          Write-Host "Unpacking $($zip.Name)"

          $tmp = Join-Path $env:RUNNER_TEMP "unzipped"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $tmp -Force

          # The ZIP normally holds one top-level folder (MagicRDR/). Its content goes to the repository root.
          $skipNames = @("__MACOSX", ".DS_Store")
          $items = @(Get-ChildItem -LiteralPath $tmp -Force | Where-Object { $skipNames -notcontains $_.Name })
          $source = $tmp
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) { $source = $items[0].FullName }
          $items = @(Get-ChildItem -LiteralPath $source -Force | Where-Object { $skipNames -notcontains $_.Name })
          if (-not ($items | Where-Object { $_.Name -eq "src" })) {
            throw "The ZIP has no src folder. Is it the right MagicRDR-project.zip?"
          }

          $neverCopy = @(".git", ".github")
          $onlyIfMissing = @("README.md", "LICENSE", ".gitignore")
          $repoRoot = $PWD.Path
          foreach ($item in $items) {
            if ($neverCopy -contains $item.Name) { continue }
            if (-not $item.PSIsContainer -and $item.Extension -ieq ".zip") { continue }
            $target = Join-Path $repoRoot $item.Name
            if ($onlyIfMissing -contains $item.Name) {
              if (Test-Path $target) { Write-Host "Keeping your $($item.Name)"; continue }
            }
            elseif (Test-Path $target) {
              Remove-Item $target -Recurse -Force
            }
            Copy-Item -LiteralPath $item.FullName -Destination $target -Recurse -Force
            Write-Host "Updated $($item.Name)"
          }

          $lines = @("EXTRACTED=true", "ZIP_NAME=$($zip.Name)")
          $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Commit unpacked sources
        if: env.EXTRACTED == 'true'
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage everything except .github: the workflow token is not allowed to change workflow files.
          # Do not touch core.autocrlf here: on Windows the checkout uses CRLF, and changing the setting
          # would make every existing file look modified (that is what broke the first version).
          git add -A -- . ":(exclude).github"
          git reset -q -- .github
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The repository already matches the ZIP. Nothing to commit."
            exit 0
          }
          git commit -m "Unpack $($env:ZIP_NAME) into the repository [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push origin "HEAD:$($env:BRANCH)"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push rejected (attempt $i). Fetching and rebasing, then trying again."
            git fetch origin $env:BRANCH
            git rebase "origin/$($env:BRANCH)"
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "Could not rebase onto origin/$($env:BRANCH)."
            }
          }
          if (-not $pushed) { throw "git push failed after 3 attempts." }
          Write-Host "Pushed the unpacked sources to $($env:BRANCH)."
          exit 0

      # Finds MagicRDR.App.csproj wherever it is in the repository.
      - name: Locate project
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path . -Recurse -Filter MagicRDR.App.csproj |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            Select-Object -First 1
          if (-not $csproj) { throw "MagicRDR.App.csproj not found. Upload the project ZIP." }
          Write-Host "Project: $($csproj.FullName)"
          $lines = @(
            "PROJECT_FILE=$($csproj.FullName)",
            "PROJECT_DIR=$($csproj.DirectoryName)"
          )
          $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # versionCode must only ever go up, or Android refuses the update. Minutes since 2026-01-01 UTC
      # never repeat and never go down, even if this workflow file is deleted and re-created.
      - name: Compute version
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::new(2026, 1, 1, 0, 0, 0, [TimeSpan]::Zero)
          $code = [int][Math]::Floor(([DateTimeOffset]::UtcNow - $epoch).TotalMinutes)
          $name = "$($env:APP_VERSION_BASE).${{ github.run_number }}"
          Write-Host "versionCode=$code versionName=$name"
          $lines = @("VERSION_CODE=$code", "VERSION_NAME=$name")
          $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Optional: put your own names list in the repository root and it is bundled into the app.
      # Accepted file names: names.txt or ImportedFileNames.txt (one file name per line).
      - name: Bundle names list
        shell: pwsh
        run: |
          $rawDir = Join-Path $env:PROJECT_DIR "Resources/Raw"
          New-Item -ItemType Directory -Force -Path $rawDir | Out-Null
          $names = Get-ChildItem -Path . -File |
            Where-Object { $_.Name -in @("names.txt", "ImportedFileNames.txt") } |
            Select-Object -First 1
          if ($names) {
            Copy-Item $names.FullName (Join-Path $rawDir "names.txt") -Force
            $count = (Get-Content $names.FullName | Measure-Object -Line).Lines
            Write-Host "Bundled $($names.Name): $count lines"
          } else {
            Write-Host "No names.txt in the repository root; using the list inside the project."
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Reports results only; a failing test does not stop the APK build.
      - name: Run unit tests
        continue-on-error: true
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.Tests.csproj
          if (-not $projects) { Write-Host "No test projects found, skipping."; exit 0 }
          $failed = $false
          foreach ($p in $projects) {
            dotnet test $p.FullName -c Release --nologo
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Install MAUI Android workload
        shell: pwsh
        run: |
          dotnet --version
          dotnet workload install maui-android
          dotnet workload list

      # Best effort: downloads any missing Android SDK platform or build-tools.
      - name: Install Android SDK components
        continue-on-error: true
        shell: pwsh
        run: >-
          dotnet build "${{ env.PROJECT_FILE }}"
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AcceptAndroidSDKLicenses=True

      - name: Restore
        shell: pwsh
        run: >-
          dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Build APK
        shell: pwsh
        run: >-
          dotnet build "${{ env.PROJECT_FILE }}"
          -c Release
          -f net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=${{ env.VERSION_CODE }}
          -p:ApplicationDisplayVersion=${{ env.VERSION_NAME }}

      # The build signs with a throw-away debug key. Here the APK is re-signed with the permanent key
      # using Google's apksigner (APK Signature Scheme v2 + v3) and then verified.
      # Without the two secrets it keeps the debug key and says so loudly (and no Release is published).
      - name: Sign and verify APK
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Optional repository VARIABLE (Settings > Variables). If set, the build fails
          # when the APK is signed with any other certificate.
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          $bin = Join-Path $env:PROJECT_DIR "bin/Release/net10.0-android"
          $built = Get-ChildItem -Path $bin -Filter *-Signed.apk -Recurse |
            Select-Object -First 1
          if (-not $built) { throw "No *-Signed.apk found under $bin" }
          New-Item -ItemType Directory -Force -Path apk-out | Out-Null
          $final = Join-Path "apk-out" "MagicRDR-Android-v$($env:VERSION_NAME).apk"

          $hasKey = -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:ANDROID_SIGNING_PASSWORD)
          if ($hasKey -ne $hasPass) {
            throw "Signing secrets are incomplete: set BOTH ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          }

          $summary = @("### Magic RDR $($env:VERSION_NAME)", "",
            "- versionName: $($env:VERSION_NAME)",
            "- versionCode: $($env:VERSION_CODE)",
            "- package: com.magicrdr.mobile")

          if (-not $hasKey) {
            Copy-Item $built.FullName $final -Force
            $msg = "No signing secrets found. This APK uses a throw-away debug key "
            $msg += "and can NOT update an installed copy. No GitHub Release will be published. See docs/RELEASING.md."
            Write-Host "::warning title=Temporary signing key::$msg"
            $summary += "- **Signing: TEMPORARY debug key (cannot update an installed copy, no Release published)**"
            $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $lines = @("SIGNED=false", "APK_FILE=$final")
            $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $apksigner = Get-ChildItem -Path (Join-Path $sdk "build-tools") -Filter apksigner.bat -Recurse |
            Sort-Object { try { [version]$_.Directory.Name } catch { [version]"0.0" } } -Descending |
            Select-Object -First 1
          if (-not $apksigner) { throw "apksigner.bat not found under $sdk/build-tools" }
          Write-Host "Using $($apksigner.FullName)"

          $ks = Join-Path $env:RUNNER_TEMP "magicrdr-release.keystore"
          try {
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $signArgs = @(
              "sign",
              "--ks", $ks,
              "--ks-key-alias", $env:KEY_ALIAS,
              "--ks-pass", "env:ANDROID_SIGNING_PASSWORD",
              "--key-pass", "env:ANDROID_SIGNING_PASSWORD",
              "--v1-signing-enabled", "false",
              "--v2-signing-enabled", "true",
              "--v3-signing-enabled", "true",
              "--out", $final,
              $built.FullName
            )
            & $apksigner.FullName @signArgs
            if ($LASTEXITCODE -ne 0) { throw "apksigner sign failed (wrong password or alias?)" }
          }
          finally {
            Remove-Item $ks -Force -ErrorAction SilentlyContinue
          }

          $verify = (& $apksigner.FullName verify --verbose --print-certs $final 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "apksigner verify failed:`n$verify" }
          Write-Host $verify
          $v2 = $verify -match "v2 scheme[^\r\n]*: true"
          $v3 = $verify -match "v3 scheme[^\r\n]*: true"
          $shaMatch = [regex]::Match($verify, "certificate SHA-256 digest: ([0-9a-fA-F]+)")
          $sha = $shaMatch.Groups[1].Value.ToLower()

          # Written before the checks, so the Summary page is filled even when a check fails.
          $summary += "- Signing: **permanent release key** (v2 = $v2, v3 = $v3)"
          $summary += "- Certificate SHA-256: ``$sha``"
          $summary += "", "Keep this fingerprint. Every future build must show the same one."
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # minSdk is 29, so apksigner writes a v3 signature only: v2 is needed just for Android 7-8.
          if (-not $v3) { throw "No v3 signature found. v2=$v2 v3=$v3" }
          if (-not $sha) { throw "Could not read the certificate fingerprint from apksigner output." }
          if ($env:EXPECTED_CERT_SHA256) {
            $want = ($env:EXPECTED_CERT_SHA256 -replace "[^0-9a-fA-F]", "").ToLower()
            if ($sha -ne $want) { throw "Wrong certificate. Expected $want but the APK has $sha" }
            Write-Host "Certificate fingerprint matches ANDROID_CERT_SHA256."
          }

          $lines = @("SIGNED=true", "APK_FILE=$final", "CERT_SHA256=$sha")
          $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      # Second APK for old 32-bit ARM phones (armeabi-v7a). It is built from exactly the same source tree and the
      # same settings as the APK above; the only difference is the CPU target (RuntimeIdentifier=android-arm).
      # The first APK is already safe in apk-out, so the build folders can be wiped for a clean second build.
      - name: Build 32-bit APK (armeabi-v7a)
        shell: pwsh
        run: |
          foreach ($dir in @("bin", "obj")) {
            $path = Join-Path $env:PROJECT_DIR $dir
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          dotnet restore "$env:PROJECT_FILE" -p:RuntimeIdentifier=android-arm
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for android-arm" }

          $buildArgs = @(
            "build", $env:PROJECT_FILE,
            "-c", "Release",
            "-f", "net10.0-android",
            "--no-restore",
            "-p:RuntimeIdentifier=android-arm",
            "-p:AndroidPackageFormat=apk",
            "-p:ApplicationVersion=$($env:VERSION_CODE)",
            "-p:ApplicationDisplayVersion=$($env:VERSION_NAME)"
          )
          dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for android-arm" }

      # Same signing, same key, same checks as the 64-bit APK. It must also show the same certificate.
      - name: Sign and verify 32-bit APK
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          $bin = Join-Path $env:PROJECT_DIR "bin/Release/net10.0-android"
          $built = Get-ChildItem -Path $bin -Filter *-Signed.apk -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $built) { throw "No *-Signed.apk found under $bin for the 32-bit build" }

          # Guard: this APK must hold the 32-bit ARM runtime and nothing for 64-bit.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apkZip = [System.IO.Compression.ZipFile]::OpenRead($built.FullName)
          try {
            $abis = @($apkZip.Entries | ForEach-Object {
              $m = [regex]::Match($_.FullName, '^lib/([^/]+)/')
              if ($m.Success) { $m.Groups[1].Value }
            } | Sort-Object -Unique)
          }
          finally {
            $apkZip.Dispose()
          }
          Write-Host "Architectures in the 32-bit APK: $($abis -join ', ')"
          if ($abis -notcontains "armeabi-v7a") { throw "The 32-bit APK has no armeabi-v7a libraries (found: $($abis -join ', '))." }
          if ($abis -contains "arm64-v8a" -or $abis -contains "x86_64") { throw "The 32-bit APK also contains other architectures (found: $($abis -join ', '))." }
          $apkMb = [Math]::Round($built.Length / 1MB, 1)

          New-Item -ItemType Directory -Force -Path apk-out | Out-Null
          $final = Join-Path "apk-out" "MagicRDR-Android-v$($env:VERSION_NAME)-armeabi-v7a.apk"

          $hasKey = -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:ANDROID_SIGNING_PASSWORD)
          if ($hasKey -ne $hasPass) {
            throw "Signing secrets are incomplete: set BOTH ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          }

          $summary = @("", "### 32-bit APK (armeabi-v7a)", "",
            "- file: $(Split-Path $final -Leaf)",
            "- architectures: $($abis -join ', ')",
            "- size: $apkMb MB")

          if (-not $hasKey) {
            Copy-Item $built.FullName $final -Force
            Write-Host "::warning title=Temporary signing key::The 32-bit APK uses a throw-away debug key too. No GitHub Release will be published."
            $summary += "- **Signing: TEMPORARY debug key**"
            $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $apksigner = Get-ChildItem -Path (Join-Path $sdk "build-tools") -Filter apksigner.bat -Recurse |
            Sort-Object { try { [version]$_.Directory.Name } catch { [version]"0.0" } } -Descending |
            Select-Object -First 1
          if (-not $apksigner) { throw "apksigner.bat not found under $sdk/build-tools" }
          Write-Host "Using $($apksigner.FullName)"

          $ks = Join-Path $env:RUNNER_TEMP "magicrdr-release-v7a.keystore"
          try {
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $signArgs = @(
              "sign",
              "--ks", $ks,
              "--ks-key-alias", $env:KEY_ALIAS,
              "--ks-pass", "env:ANDROID_SIGNING_PASSWORD",
              "--key-pass", "env:ANDROID_SIGNING_PASSWORD",
              "--v1-signing-enabled", "false",
              "--v2-signing-enabled", "true",
              "--v3-signing-enabled", "true",
              "--out", $final,
              $built.FullName
            )
            & $apksigner.FullName @signArgs
            if ($LASTEXITCODE -ne 0) { throw "apksigner sign failed (wrong password or alias?)" }
          }
          finally {
            Remove-Item $ks -Force -ErrorAction SilentlyContinue
          }

          $verify = (& $apksigner.FullName verify --verbose --print-certs $final 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "apksigner verify failed:`n$verify" }
          Write-Host $verify
          $v3 = $verify -match "v3 scheme[^\r\n]*: true"
          $shaMatch = [regex]::Match($verify, "certificate SHA-256 digest: ([0-9a-fA-F]+)")
          $sha = $shaMatch.Groups[1].Value.ToLower()

          $summary += "- Signing: **permanent release key** (v3 = $v3)"
          $summary += "- Certificate SHA-256: ``$sha``"
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if (-not $v3) { throw "No v3 signature found on the 32-bit APK." }
          if (-not $sha) { throw "Could not read the certificate fingerprint from apksigner output." }
          # Both APKs must carry the very same certificate, or one of them could not update the other.
          if ($env:CERT_SHA256 -and $sha -ne $env:CERT_SHA256) {
            throw "The 32-bit APK certificate ($sha) differs from the 64-bit APK certificate ($($env:CERT_SHA256))."
          }
          if ($env:EXPECTED_CERT_SHA256) {
            $want = ($env:EXPECTED_CERT_SHA256 -replace "[^0-9a-fA-F]", "").ToLower()
            if ($sha -ne $want) { throw "Wrong certificate. Expected $want but the 32-bit APK has $sha" }
          }

          "APK_FILE_V7A=$final" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: MagicRDR-android-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      # Creates (or updates) the Release "v<versionName>" and attaches the signed APK as a public asset.
      # Only runs when the APK was signed with the permanent key.
      - name: Publish GitHub Release
        if: env.SIGNED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Continue"
          $ver = $env:VERSION_NAME
          $tag = "v$ver"
          $apk = (Resolve-Path $env:APK_FILE).Path
          $apkName = Split-Path $apk -Leaf
          $apkSha = (Get-FileHash -Algorithm SHA256 -Path $apk).Hash.ToLower()
          $sizeMb = [Math]::Round((Get-Item $apk).Length / 1MB, 1)
          $commit = (git rev-parse HEAD).Trim()
          $short = $commit.Substring(0, 7)
          $bt = [string][char]96

          # The 32-bit APK (if it was built and signed) is attached to the same Release.
          $assets = @($apk)
          $apk7Lines = @()
          if ($env:APK_FILE_V7A) {
            $apk7 = (Resolve-Path $env:APK_FILE_V7A).Path
            $assets += $apk7
            $apk7Name = Split-Path $apk7 -Leaf
            $apk7Sha = (Get-FileHash -Algorithm SHA256 -Path $apk7).Hash.ToLower()
            $size7Mb = [Math]::Round((Get-Item $apk7).Length / 1MB, 1)
            $apk7Lines = @(
              "",
              "### Which file?",
              "- **$apkName** ($sizeMb MB): 64-bit phones (almost every phone made in recent years).",
              "- **$apk7Name** ($size7Mb MB): older 32-bit ARM phones (armeabi-v7a).",
              "- 32-bit APK file SHA-256: $bt$apk7Sha$bt",
              "",
              "### أي ملف أنزّل؟",
              "- الملف الأول (64-bit): لمعظم الهواتف الحديثة.",
              "- الملف الذي ينتهي بـ armeabi-v7a: للهواتف القديمة ذات المعالج 32-bit."
            )
          }

          # "What's new": first the Unreleased section of CHANGELOG.md (written by you), then, automatically,
          # the titles of the commits made since the previous Release.
          $changeText = ""
          if (Test-Path "CHANGELOG.md") {
            $all = @(Get-Content -Path "CHANGELOG.md" -Encoding utf8)
            $start = -1
            for ($i = 0; $i -lt $all.Count; $i++) {
              if ($all[$i] -match '^##\s+Unreleased\s*$') { $start = $i; break }
            }
            if ($start -ge 0) {
              $body = @()
              for ($j = $start + 1; $j -lt $all.Count; $j++) {
                if ($all[$j] -match '^##\s') { break }
                $body += $all[$j]
              }
              $changeText = ($body -join "`n").Trim()
            }
          }

          $prevTag = (git tag --list "v*" --sort=-v:refname | Where-Object { $_ -and $_ -ne $tag } | Select-Object -First 1)
          $commitLines = @()
          if ($prevTag) {
            $subjects = @(git log "$prevTag..HEAD" --no-merges "--pretty=format:%s")
            if ($LASTEXITCODE -eq 0) {
              $commitLines = @($subjects |
                Where-Object { $_ -and $_ -notmatch '^Unpack ' -and $_ -notmatch '^Changelog' } |
                Select-Object -Unique |
                Select-Object -First 20 |
                ForEach-Object { "- $_" })
            }
          }

          $changeBlock = @("", "### What's new / الجديد", "")
          if ($changeText) {
            $changeBlock += ($changeText -split "`r?`n")
          }
          else {
            $changeBlock += "- Maintenance build: see the commits below."
          }
          if ($commitLines.Count -gt 0) {
            $changeBlock += @("", "Commits in this build:")
            $changeBlock += $commitLines
          }
          if ($prevTag) {
            $changeBlock += @("", "Full comparison: https://github.com/$($env:REPO)/compare/$prevTag...$tag")
          }

          $lines = @(
            "## Magic RDR $ver",
            "",
            "Direct download: **$apkName** ($sizeMb MB). Requires Android 10 or newer.",
            "",
            "### Verify before installing",
            "- APK file SHA-256: $bt$apkSha$bt",
            "- Signing certificate SHA-256: $bt$($env:CERT_SHA256)$bt",
            "",
            "Every release is signed with the same permanent key, so a new version installs over the old one. If the certificate fingerprint differs from the one above or from the README, do not install the file.",
            "",
            "### التثبيت",
            "1. نزّل ملف APK من قسم Assets أدناه.",
            "2. اسمح بالتثبيت من مصادر غير معروفة عندما يطلب أندرويد ذلك.",
            "3. ثبّته فوق النسخة القديمة مباشرة: التوقيع واحد فتبقى بياناتك.",
            "",
            "Build: commit $short, GitHub Actions run $($env:GITHUB_RUN_NUMBER)"
          )
          $lines = $lines[0..2] + $changeBlock + $apk7Lines + $lines[3..($lines.Count - 1)]
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          ($lines -join "`n") | Set-Content -Path $notes -Encoding utf8

          $null = gh release view $tag --repo $env:REPO 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists: updating it."
            gh release upload $tag @assets --clobber --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --repo $env:REPO --title "Magic RDR $ver" --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          }
          else {
            Write-Host "Creating release $tag."
            gh release create $tag @assets --repo $env:REPO --target $commit --title "Magic RDR $ver" --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }

          $link = "https://github.com/$($env:REPO)/releases/tag/$tag"
          Write-Host "Release: $link"
          "- Release: $link" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      # After a Release is published, the "Unreleased" notes of CHANGELOG.md are filed under this version,
      # so the next Release starts with an empty list. Best effort: the Release is already published, so a
      # failure here loses nothing.
      - name: Roll changelog
        if: env.SIGNED == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if (-not (Test-Path "CHANGELOG.md")) { Write-Host "No CHANGELOG.md."; exit 0 }
          $all = @(Get-Content -Path "CHANGELOG.md" -Encoding utf8)
          $idx = -1
          for ($i = 0; $i -lt $all.Count; $i++) {
            if ($all[$i] -match '^##\s+Unreleased\s*$') { $idx = $i; break }
          }
          if ($idx -lt 0) { Write-Host "No Unreleased section."; exit 0 }

          $hasText = $false
          for ($j = $idx + 1; $j -lt $all.Count; $j++) {
            if ($all[$j] -match '^##\s') { break }
            if ($all[$j].Trim().Length -gt 0) { $hasText = $true; break }
          }
          if (-not $hasText) { Write-Host "Unreleased is empty: nothing to file."; exit 0 }

          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $head = @($all[0..$idx])
          $tail = @()
          if ($idx + 1 -lt $all.Count) { $tail = @($all[($idx + 1)..($all.Count - 1)]) }
          $out = $head + @("", "## $($env:VERSION_NAME) - $date") + $tail
          $text = ($out -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD.Path "CHANGELOG.md"), $text, [System.Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Changelog: $($env:VERSION_NAME) [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push origin "HEAD:$($env:BRANCH)"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push rejected (attempt $i). Fetching and rebasing, then trying again."
            git fetch origin $env:BRANCH
            git rebase "origin/$($env:BRANCH)"
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "Could not rebase onto origin/$($env:BRANCH)."
            }
          }
          if (-not $pushed) { throw "git push failed after 3 attempts." }
          Write-Host "Changelog filed under $($env:VERSION_NAME)."
          exit 0
