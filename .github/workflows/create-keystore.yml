name: Create signing key (run once)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE (or REPLACE if a key already exists)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-key:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check input and secrets
        shell: pwsh
        env:
          CONFIRM: ${{ inputs.confirm }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXISTING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ($env:CONFIRM -notin @("CREATE", "REPLACE")) {
            throw "Type CREATE (or REPLACE) in the confirm box."
          }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PASSWORD)) {
            throw "First create the repository secret ANDROID_KEYSTORE_PASSWORD."
          }
          if ($env:STORE_PASSWORD.Length -lt 12) {
            throw "ANDROID_KEYSTORE_PASSWORD must be at least 12 characters."
          }
          $exists = -not [string]::IsNullOrWhiteSpace($env:EXISTING_KEY)
          if ($exists -and $env:CONFIRM -ne "REPLACE") {
            throw ("A permanent key already exists. Replacing it breaks updates of " +
              "installed apps. Type REPLACE only if you really want that.")
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the key
        shell: pwsh
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path key-out | Out-Null
          $ks = "key-out/magicrdr-release.keystore"
          $genArgs = @(
            "-genkeypair",
            "-keystore", $ks,
            "-storetype", "PKCS12",
            "-alias", "magicrdr",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-sigalg", "SHA256withRSA",
            "-validity", "36500",
            "-dname", "CN=Magic RDR, O=Magic RDR, C=US",
            "-storepass:env", "STORE_PASSWORD"
          )
          & keytool @genArgs
          if ($LASTEXITCODE -ne 0) { throw "keytool failed" }

          $bytes = [IO.File]::ReadAllBytes($ks)
          [Convert]::ToBase64String($bytes) |
            Set-Content -Path "key-out/keystore.base64.txt" -NoNewline -Encoding ascii

          $listArgs = @("-list", "-v", "-keystore", $ks, "-alias", "magicrdr", "-storepass:env", "STORE_PASSWORD")
          $info = (& keytool @listArgs | Out-String)
          $sha = ($info -split "`n" | Where-Object { $_ -match "SHA256:" } | Select-Object -First 1).Trim()
          $lines = @(
            "### Permanent signing key created",
            "",
            "- alias: ``magicrdr`` (RSA 2048, valid 100 years)",
            "- $sha",
            "",
            "Next: download the artifact **signing-key-backup**, keep the .keystore file safe,",
            "and save the text of keystore.base64.txt as the secret ANDROID_KEYSTORE_BASE64.",
            "Details: docs/RELEASING.md"
          )
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The key is protected by the password (kept only in Secrets), but still treat this artifact as sensitive:
      # it lives one day, and you should delete this workflow run after downloading.
      - name: Upload key backup (kept 1 day)
        uses: actions/upload-artifact@v6
        with:
          name: signing-key-backup
          path: key-out/*
          if-no-files-found: error
          retention-days: 1
